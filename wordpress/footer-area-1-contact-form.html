<form action="https://api.web3forms.com/submit" method="POST">
  <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
  <input type="hidden" name="subject" value="New enquiry from J.W Electrical footer form">
  <input type="hidden" name="from_name" value="J.W Electrical Website">
  <input type="checkbox" name="botcheck" style="display:none">
  <div class="column one-third"><label for="f-name">Name:</label><input id="f-name" type="text" name="name" placeholder="Your Name" required></div>
  <div class="column one-third"><label for="f-email">E-mail address:</label><input id="f-email" type="email" name="email" placeholder="Your Email" required></div>
  <div class="column one-third"><label for="f-phone">Telephone number:</label><input id="f-phone" type="tel" name="phone" placeholder="Your Phone Number" required></div>
  <div class="column one"><label for="f-postcode">Postcode:</label><input id="f-postcode" type="text" name="postcode" placeholder="Your Postcode" required></div>
  <div class="column one"><label for="f-job">Job Type:</label><select id="f-job" name="job_type"><option value="">Please select</option><option value="Additional sockets / power points">Additional sockets / power points</option><option value="Lighting (inside or outside)">Lighting (inside or outside)</option><option value="Full or partial rewire">Full or partial rewire</option><option value="Fault finding / repairs">Fault finding / repairs</option><option value="Electric heating">Electric heating</option><option value="Conduit / containment">Conduit / containment</option><option value="Commercial / industrial work">Commercial / industrial work</option><option value="Agricultural / farm work">Agricultural / farm work</option><option value="Other">Other</option></select></div>
  <div class="column one"><label for="f-message">Message:</label><textarea id="f-message" name="message" placeholder="Tell us about the job..."></textarea></div>
  <div class="column one"><input type="submit" value="Send Message"></div>
</form>
